<div class="app">

  <!-- 侧栏 / 导轨 -->
  <nav class="rail" id="rail" aria-label="主导航">
    <div class="brand">
      <div class="brand__mark">l</div>
      <div class="brand__txt">lex<small>我的英语学习库</small></div>
    </div>
    <ul class="navlist" id="nav"></ul>
    <div class="rail__foot">
      <button class="btn btn--icon btn--ghost" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg width="18" height="18"><use href="#i-sun"/></svg>
      </button>
      <button class="btn btn--icon btn--ghost" id="shuffleBtn" title="随机复习一条" aria-label="随机复习">
        <svg width="18" height="18"><use href="#i-shuffle"/></svg>
      </button>
    </div>
  </nav>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn--icon btn--ghost topbar__menu" id="menuBtn"
              aria-label="打开导航" aria-controls="rail" aria-expanded="false">
        <svg width="18" height="18"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar__title" id="pageTitle">概览<small>OVERVIEW</small></div>
      <div class="topbar__spacer"></div>
      <div class="search" id="searchBox">
        <span class="search__icon"><svg width="17" height="17"><use href="#i-search"/></svg></span>
        <input id="searchInput" type="search" placeholder="搜索词根、单词、句式、范文…" autocomplete="off" aria-label="全站搜索">
        <button class="search__clear" id="searchClear" aria-label="清除"><svg width="14" height="14"><use href="#i-x"/></svg></button>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- 手机上侧栏变成可折叠抽屉，这层遮罩用来点击关闭 -->
<div class="scrim" id="scrim" hidden></div>

<!-- 右下角：随机复习下一条 -->
<button class="fab" id="fabShuffle" aria-label="随机复习下一条">
  <svg width="22" height="22"><use href="#i-shuffle"/></svg>
</button>
